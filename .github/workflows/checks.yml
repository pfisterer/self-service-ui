name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run, so checks are a local step). This is
# where the checks live instead — cheap, no Docker, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      # ci, not install: fails on a package-lock.json that disagrees with
      # package.json instead of quietly resolving something else.
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Unit tests, pure functions only — no DOM, no rendering. Runs even when
      # the lint step failed, so one push reports both problems instead of
      # hiding the second behind the first.
      - name: Vitest
        if: '!cancelled()'
        run: npm test
