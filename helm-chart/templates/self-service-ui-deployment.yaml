{{- $comp := dict "context" . "component" "self-service-ui" -}}
{{- $uiName := include "cloud-self-service.componentName" $comp -}}
{{- $labels := include "cloud-self-service.labels" $comp -}}
{{- $selectors := include "cloud-self-service.selectorLabels" $comp -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $uiName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.selfServiceUI.replicas }}
  # A rollout without a gap: the new pod first, the old one only once the new one is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- $selectors | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "cloud-self-service.rolloutAnnotations" . | nindent 8 }}
      labels:
        {{- $selectors | nindent 8 }}
    spec:
      # This pod never talks to the Kubernetes API — do not hand it a token for it.
      automountServiceAccountToken: false
      # preStop pause (5 s) + Caddy's grace period after SIGTERM (20 s, Caddyfile) fit in here.
      terminationGracePeriodSeconds: 30
      containers:
        - name: self-service-ui
          # The tag falls back to this chart's appVersion, which is what makes a
          # pinned chart version pin the image too: under the umbrella chart no
          # version is passed at all, so "new chart, old image" cannot occur.
          # An explicit value still wins — that is how argocd-image-updater
          # keeps driving the standalone releases.
          image: {{ .Values.selfServiceUI.image }}:{{ .Values.selfServiceUI.version | default .Chart.AppVersion }}{{ with .Values.selfServiceUI.digest }}@{{ . }}{{ end }}
          imagePullPolicy: {{ .Values.selfServiceUI.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8080
          # Wait before SIGTERM until the pod is out of the Service's endpoints; then Caddy finishes what is in flight.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # The page is served once Caddy runs and the entrypoint has written config.js; only then does the pod get traffic.
          readinessProbe:
            httpGet: {path: /config.js, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /config.js, port: 8080}
            periodSeconds: 20
          # Hardening: non-root, no privilege escalation, no capabilities, default
          # seccomp. The image sets USER 65532 and owns the three paths this
          # container writes. readOnlyRootFilesystem is deliberately NOT set: the
          # entrypoint renders /srv/www/config.js at startup and Caddy keeps state
          # in /config and /data — making those writable again via emptyDir would
          # shadow the built assets, so the rootfs stays writable here.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          env:
            # The version this process reports (index page, config.json, portal footer): the tag the image is deployed under (same expression as the image tag). A stable release retags a pre-release image without rebuilding, so the version baked into the image can be the pre-release's.
            - name: APP_VERSION
              value: {{ .Values.selfServiceUI.version | default .Chart.AppVersion | quote }}
            - name: DYN_ZONES_BASE_URL
              value: "{{ .Values.selfServiceUI.dynamicZonesBaseUrl }}"
            - name: DYN_ZONES_MCP_URL
              value: "{{ .Values.selfServiceUI.dynamicZonesMcpUrl }}"
            # Empty -> Cloud Projects tab disabled (route not registered, nav link hidden).
            - name: CLOUD_RESOURCES_BASE_URL
              value: "{{ .Values.selfServiceUI.cloudResourcesBaseUrl }}"
            - name: CLOUD_RESOURCES_MCP_URL
              value: "{{ .Values.selfServiceUI.cloudResourcesMcpUrl }}"
            # Empty -> LLM section disabled.
            - name: LLM_BASE_URL
              value: "{{ .Values.selfServiceUI.llmBaseUrl }}"
            # Empty -> groups section disabled.
            - name: GROUPS_BASE_URL
              value: "{{ .Values.selfServiceUI.groupsBaseUrl }}"
            # Empty -> notification settings page disabled.
            - name: NOTIFICATIONS_BASE_URL
              value: "{{ .Values.selfServiceUI.notificationsBaseUrl }}"
            - name: ACME_SERVER
              value: "{{ .Values.selfServiceUI.acmeServer }}"
            # Hosts allowed as return address (?back=) of /projects/start, besides the UI itself.
            - name: BACK_HOSTS
              value: "{{ .Values.selfServiceUI.backHosts | default list | join "," }}"
            {{- if .Values.selfServiceUI.dynamicZonesUpstream }}
            - name: DYN_ZONES_UPSTREAM
              value: "{{ .Values.selfServiceUI.dynamicZonesUpstream }}"
            {{- end }}
            {{- if .Values.selfServiceUI.cloudResourcesUpstream }}
            - name: CLOUD_RESOURCES_UPSTREAM
              value: "{{ .Values.selfServiceUI.cloudResourcesUpstream }}"
            {{- end }}
            {{- if .Values.selfServiceUI.notificationsUpstream }}
            - name: NOTIFICATIONS_UPSTREAM
              value: "{{ .Values.selfServiceUI.notificationsUpstream }}"
            {{- end }}
            {{- if .Values.selfServiceUI.groupsUpstream }}
            - name: GROUPS_UPSTREAM
              value: "{{ .Values.selfServiceUI.groupsUpstream }}"
            {{- end }}
            {{- if .Values.selfServiceUI.llmUpstream }}
            - name: LLM_UPSTREAM
              value: "{{ .Values.selfServiceUI.llmUpstream }}"
            - name: LLM_HOST
              value: "{{ required "selfServiceUI.llmHost is required with llmUpstream" .Values.selfServiceUI.llmHost }}"
            {{- end }}
            - name: OIDC_ISSUER_URL
              value: "{{ .Values.auth.oidc.issuerUrl  }}"
            - name: OIDC_CLIENT_ID
              value: "{{ .Values.auth.oidc.clientId }}"
            - name: OIDC_END_SESSION_URL
              value: "{{ .Values.auth.oidc.endSessionUrl }}"

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $uiName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    {{- $selectors | nindent 4 }}
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

# enable if ingress.enabled is true
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $uiName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.selfServiceUI.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $uiName }}
                port:
                  number: 8080
  tls:
    - hosts:
        - {{ .Values.selfServiceUI.hostname | quote }}
{{- end }}