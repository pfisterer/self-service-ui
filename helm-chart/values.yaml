---
#------------------------------------
# Self-Service UI Configuration
#------------------------------------

selfServiceUI:
  hostname: "self-service-ui.example.com"
  replicas: 1
  imagePullPolicy: "Always"
  image: "ghcr.io/pfisterer/self-service-ui"
  # Empty -> the chart\'s appVersion is used (see the deployment template).
  version: ""
  dynamicZonesBaseUrl: https://dyndnsapi.example.com
  # OpenStack management API base URL. Empty disables the Cloud Projects tab
  # (route unregistered + nav link hidden). Set it only where the backend works.
  cloudResourcesBaseUrl: ""
  # DHBW-internal ACME server (acme2certifier) shown on the "TLS Certificates" tab.
  acmeServer: https://certificates.dhbw.cloud
  # In-cluster addresses Caddy forwards the SPA's same-origin /api/<svc>/ calls
  # to. These are Service names of OTHER releases, so this chart cannot derive
  # them — and leaving them as image defaults meant a rename over there broke
  # this deployment with a 502 that nothing here could fix. Empty -> the image
  # default applies.
  dynamicZonesUpstream: ""
  cloudResourcesUpstream: ""

#------------------------------------
# OIDC/Auth Configuration
#------------------------------------
auth:
  oidc:
    issuerUrl: https://sso.example.cloud/realms/example
    clientId: example-cloud-dns

#------------------------------------
# Ingress Configuration
#------------------------------------
ingress:
  enabled: true
  # Empty className -> field omitted -> cluster default IngressClass (Traefik on
  # k3s). No cert-manager annotation: TLS = cluster wildcard default cert.
  className: ""
  annotations: {}

# BFF (oauth2-proxy in front of the SPA). Off by default: it only makes sense
# where this chart also owns the public ingress, and an environment that still
# runs its own proxy alongside would end up with two owners of the same host.
#
# It lives in this chart rather than one level up because its upstream IS the
# Service above — deriving that name beats writing it out and watching it go
# stale.
bff:
  enabled: false
  image: quay.io/oauth2-proxy/oauth2-proxy
  version: v7.15.3
  # Supplies client-id, client-secret and cookie-secret. Created out of band;
  # keeping the cookie-secret stable across a redeploy is what keeps sessions
  # alive.
  existingSecret: oauth2-proxy-ui-secret
  # Distinct from any other oauth2-proxy on a parent domain — a colliding
  # cookie name fails the signature check and loops the login.
  cookieName: _oauth2_proxy_selfservice
  # How long a session survives before the user is sent back to the issuer.
  # Set explicitly because the oauth2-proxy default is 168h, and together with
  # the offline_access scope that means a week without the login being checked
  # again: an offline refresh token is deliberately NOT bound to the SSO
  # session, so neither an idle timeout nor a logout elsewhere nor "sign out
  # all sessions" in the Keycloak admin console reaches this cookie. Eight
  # hours does not close that gap — it bounds it to a working day. If the SSO
  # session is still alive the re-login is a silent redirect, so the practical
  # cost is at most one interactive login per day.
  cookieExpire: 8h
  # Hosts the proxy may redirect to besides the UI itself; the issuer's host
  # belongs here, or RP-initiated logout cannot reach its end-session endpoint.
  whitelistDomains: []
  ingress:
    enabled: true
    className: traefik
    annotations: {}
