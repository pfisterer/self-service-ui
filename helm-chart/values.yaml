---
#------------------------------------
# Self-Service UI Configuration
#------------------------------------

selfServiceUI:
  hostname: "self-service-ui.example.com"
  replicas: 1
  imagePullPolicy: "Always"
  image: "ghcr.io/pfisterer/self-service-ui"
  # Empty -> the chart\'s appVersion is used (see the deployment template).
  version: ""
  dynamicZonesBaseUrl: https://dyndnsapi.example.com
  # OpenStack management API base URL. Empty disables the Cloud Projects tab
  # (route unregistered + nav link hidden). Set it only where the backend works.
  cloudResourcesBaseUrl: ""
  # DHBW-internal ACME server (acme2certifier) shown on the "TLS Certificates" tab.
  acmeServer: https://certificates.dhbw.cloud
  # In-cluster addresses Caddy forwards the SPA's same-origin /api/<svc>/ calls
  # to. These are Service names of OTHER releases, so this chart cannot derive
  # them — and leaving them as image defaults meant a rename over there broke
  # this deployment with a 502 that nothing here could fix. Empty -> the image
  # default applies.
  dynamicZonesUpstream: ""
  cloudResourcesUpstream: ""

#------------------------------------
# OIDC/Auth Configuration
#------------------------------------
auth:
  oidc:
    issuerUrl: https://sso.example.cloud/realms/example
    clientId: example-cloud-dns

#------------------------------------
# Ingress Configuration
#------------------------------------
ingress:
  enabled: true
  # Empty className -> field omitted -> cluster default IngressClass (Traefik on
  # k3s). No cert-manager annotation: TLS = cluster wildcard default cert.
  className: ""
  annotations: {}
